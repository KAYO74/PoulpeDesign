[package]
name = "poulpe"
version = "1.1.1"
description = "Poulpe Design, application libre de création graphique"
authors = ["Contributeurs de Poulpe Design"]
license = "MPL-2.0"
repository = "https://github.com/KAYO74/Poulpe"
edition = "2021"
rust-version = "1.77"

[lib]
name = "poulpe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
fontdb = "0.23"
# Moteur de calcul des images (carte graphique via wgpu, ou tous les cœurs du processeur).
poulpe-engine = { path = "../../../crates/poulpe-engine", features = ["gpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mises à jour automatiques (pas sur les plateformes mobiles).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
# Appel des commandes comme depuis l'interface, dans les tests.
tauri = { version = "2", features = ["test"] }
