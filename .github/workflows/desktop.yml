name: Installeurs de bureau

# Produit les installeurs Windows (.msi, .exe), macOS (.dmg) et Linux (.deb, AppImage).
# Sur une étiquette `v*` (par exemple `git tag v0.2.0 && git push origin v0.2.0`), ou lancé à la main
# depuis l'onglet Actions avec une étiquette à créer, ils sont publiés dans une version GitHub, sous des
# noms sans numéro de version pour que les liens de téléchargement du README (`releases/latest/download/...`) restent valables d'une version à l'autre.
# Une étiquette avec un tiret (`v0.2.0-beta.1`) donne une préversion, qui ne remplace pas la dernière version.
# Sans étiquette, les installeurs sont gardés en artefacts du workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Étiquette de la version à publier (par exemple v0.2.0). Vide : installeurs en artefacts seulement.'
        required: false
        default: ''
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'

env:
  TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
  RELEASE_BODY: |
    Téléchargez l'installeur de votre système ci-dessous, ou suivez le guide : [Installer Poulpe Design](https://github.com/${{ github.repository }}/blob/main/docs/installer.md).

    | Système | Fichier |
    | --- | --- |
    | Windows | `Poulpe_windows_x64-setup.exe` (ou `.msi`) |
    | macOS (puces Apple M1 à M4) | `Poulpe_darwin_aarch64.dmg` |
    | macOS (Intel) | `Poulpe_darwin_x64.dmg` |
    | Linux (Ubuntu, Debian) | `Poulpe_linux_amd64.deb` |
    | Linux (autres distributions) | `Poulpe_linux_amd64.AppImage` |

    L'appli n'est pas encore signée : Windows et macOS affichent un avertissement au premier lancement. Le guide explique comment l'ouvrir quand même.

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ''
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système de Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # Signature : chaque partie ne s'active que si ses secrets existent (Settings > Secrets and
      # variables > Actions). Sans eux, les installeurs sont produits comme avant, non signés.
      # Voir docs/signature-et-mises-a-jour.md.
      - name: Signature et mises à jour (si configurées)
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          conf=apps/desktop/src-tauri/tauri.conf.json
          # Mises à jour automatiques : fichiers de mise à jour signés et latest.json.
          if [ -n "$UPDATER_KEY" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<POULPE_EOF"
              echo "$UPDATER_KEY"
              echo "POULPE_EOF"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            node -e "const f='$conf',c=JSON.parse(require('fs').readFileSync(f));c.bundle.createUpdaterArtifacts=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
            echo "Mises à jour automatiques : activées."
          else
            echo "Mises à jour automatiques : secret TAURI_SIGNING_PRIVATE_KEY absent, fichiers de mise à jour non produits."
          fi
          # macOS : certificat Developer ID et notarisation Apple.
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "macOS : signature et notarisation activées."
          fi
          # Windows : Azure Trusted Signing.
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            cargo install trusted-signing-cli --locked
            for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
            node -e "const f='$conf',c=JSON.parse(require('fs').readFileSync(f));c.bundle.windows={...(c.bundle.windows||{}),signCommand:'trusted-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE -d Poulpe %1'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
            echo "Windows : signature activée."
          fi
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG && format('Poulpe Design {0}', env.TAG) || '' }}
          releaseBody: ${{ env.TAG && env.RELEASE_BODY || '' }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          assetNamePattern: Poulpe_[platform]_[arch][setup][ext]
          # latest.json (mises à jour automatiques) pointe vers l'installeur .exe sous Windows.
          updaterJsonPreferNsis: true
      - uses: actions/upload-artifact@v4
        if: ${{ !env.TAG }}
        with:
          name: poulpe-${{ runner.os }}-${{ strategy.job-index }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
          retention-days: 14

  # Chaque installeur ajoute sa plateforme à latest.json : deux qui finissent en même temps peuvent
  # effacer l'ajout de l'autre (la v1.2.0 a perdu macOS Apple). Une fois tout publié, le fichier est
  # refait d'après les fichiers .sig de la version.
  updater-json:
    name: Fichier des mises à jour
    needs: build
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.tag) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refaire latest.json
        run: |
          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx latest.json; then
            echo "Pas de latest.json (mises à jour automatiques non configurées)."
            exit 0
          fi
          mkdir updater && cd updater
          gh release download "$TAG" -p latest.json -p '*.sig'
          node - <<'EOF'
          const fs = require('fs');
          // Plateforme des mises à jour → fichier publié (voir assetNamePattern ; Windows : le .exe).
          const files = {
            'darwin-aarch64': 'Poulpe_darwin_aarch64.app.tar.gz',
            'darwin-aarch64-app': 'Poulpe_darwin_aarch64.app.tar.gz',
            'darwin-x86_64': 'Poulpe_darwin_x64.app.tar.gz',
            'darwin-x86_64-app': 'Poulpe_darwin_x64.app.tar.gz',
            'linux-x86_64': 'Poulpe_linux_amd64.AppImage',
            'linux-x86_64-appimage': 'Poulpe_linux_amd64.AppImage',
            'linux-x86_64-deb': 'Poulpe_linux_amd64.deb',
            'windows-x86_64': 'Poulpe_windows_x64-setup.exe',
            'windows-x86_64-nsis': 'Poulpe_windows_x64-setup.exe',
            'windows-x86_64-msi': 'Poulpe_windows_x64.msi',
          };
          const json = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          json.platforms = {};
          for (const [key, file] of Object.entries(files)) {
            if (!fs.existsSync(`${file}.sig`)) continue;
            json.platforms[key] = {
              signature: fs.readFileSync(`${file}.sig`, 'utf8'),
              url: `https://github.com/${process.env.GH_REPO}/releases/download/${process.env.TAG}/${file}`,
            };
          }
          fs.writeFileSync('latest.json', JSON.stringify(json, null, 2));
          console.log('Plateformes :', Object.keys(json.platforms).join(', '));
          EOF
          gh release upload "$TAG" latest.json --clobber
